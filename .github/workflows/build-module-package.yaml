name: Build module package (test builds, no release)

on:
  workflow_dispatch:
  push:
    branches-ignore: ['main']

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack (Yarn v4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run tests
        run: yarn test

      - name: Build package (.tgz)
        run: yarn package

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload Companion package (.tgz, no ZIP wrapper)
        uses: actions/upload-artifact@v7
        with:
          # Direct upload requires exactly one file and uses its filename as the artifact name.
          path: waves-superrack-router-${{ steps.version.outputs.version }}.tgz
          archive: false
          if-no-files-found: error
