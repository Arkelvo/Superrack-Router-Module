name: Finalize Release Draft

on:
  workflow_dispatch:
    inputs:
      draft_tag:
        description: 'Draft release tag (e.g., 0.9.0)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  finalize:
    name: Finalize Release Draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify draft release exists
        id: verify-draft
        uses: octokit/request-action@v2.x
        with:
          route: GET /repos/{owner}/{repo}/releases
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Enable Corepack (Yarn v4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run tests on final commit
        run: yarn test

      - name: Build package
        run: yarn package

      - name: Verify package
        run: |
          PKG_VERSION=$(node -e "console.log(require('./package.json').version)")
          MANIFEST_VERSION=$(node -e "console.log(require('./companion/manifest.json').version)")
          if [ "$PKG_VERSION" != "${{ github.event.inputs.draft_tag }}" ] || [ "$MANIFEST_VERSION" != "${{ github.event.inputs.draft_tag }}" ]; then
            echo "Version mismatch: package.json=$PKG_VERSION, manifest.json=$MANIFEST_VERSION, expected=${{ github.event.inputs.draft_tag }}"
            exit 1
          fi

      - name: Calculate package SHA256
        id: pkg-sha
        run: |
          TGZ_FILE=$(ls *.tgz | head -n1)
          SHA256=$(sha256sum "$TGZ_FILE" | cut -d' ' -f1)
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "file=$TGZ_FILE" >> $GITHUB_OUTPUT

      - name: Create tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if git rev-parse "${{ github.event.inputs.draft_tag }}" >/dev/null 2>&1; then
            EXISTING_SHA=$(git rev-parse "${{ github.event.inputs.draft_tag }}")
            CURRENT_SHA=$(git rev-parse HEAD)
            if [ "$EXISTING_SHA" != "$CURRENT_SHA" ]; then
              echo "Tag ${{ github.event.inputs.draft_tag }} already exists on different commit ($EXISTING_SHA vs $CURRENT_SHA)"
              exit 1
            fi
            echo "Tag already exists on correct commit"
          else
            git tag "${{ github.event.inputs.draft_tag }}"
            git push origin "${{ github.event.inputs.draft_tag }}"
          fi

      - name: Upload package to draft release
        uses: octokit/request-action@v2.x
        with:
          route: POST /repos/{owner}/{repo}/releases/{release_id}/assets
          release_id: ${{ steps.verify-draft.outputs.release_id }}
          name: ${{ steps.pkg-sha.outputs.file }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Note: This is a simplified version - actual implementation would need to read the file

      - name: Generate readiness report
        run: |
          cat > release-readiness.json <<EOF
          {
            "tag": "${{ github.event.inputs.draft_tag }}",
            "commit_sha": "$(git rev-parse HEAD)",
            "package_sha256": "${{ steps.pkg-sha.outputs.sha256 }}",
            "manifest_version": "${{ github.event.inputs.draft_tag }}",
            "package_version": "${{ github.event.inputs.draft_tag }}",
            "ci_run_id": "${{ github.run_id }}",
            "readiness_status": "READY_TO_PUBLISH"
          }
          EOF
          cat release-readiness.json

      - name: Upload readiness report
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness
          path: release-readiness.json